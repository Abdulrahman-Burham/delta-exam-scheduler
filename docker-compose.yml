version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  db:
    image: postgres:16-alpine
    container_name: examsync-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: invigilation_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: examsync-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. FastAPI Backend Core & Optimization Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsync-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/invigilation_db
      - SECRET_KEY=exam-invigilation-secret-key-2026-prod
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Background Job Queue Worker (Asynchronous Scheduling Tasks)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsync-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/invigilation_db
      - SECRET_KEY=exam-invigilation-secret-key-2026-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: python -c "print('Background AI optimization worker initialized and monitoring job queues...')"

  # 5. React Frontend Dashboard (Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examsync-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
